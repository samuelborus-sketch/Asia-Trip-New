<main>
  <div class="sec-head">
    <div class="sec-title serif">Lists</div>
    <div class="sec-sub">Tap items to check them off · saves to this device</div>
  </div>

  <div class="list-tabs">
    <button class="list-tab active" id="tab-cl" onclick="switchTab('cl')">Pre-Trip Checklist</button>
    <button class="list-tab" id="tab-pk" onclick="switchTab('pk')">Packing List</button>
  </div>

  <!-- Checklist -->
  <div id="view-cl">
    <div class="progress-header">
      <span class="prog-label">Items completed</span>
      <span class="prog-count" id="cl-count">0 / 0</span>
    </div>
    <div class="progress-bar" style="margin-bottom:16px"><div class="progress-fill" id="cl-bar" style="width:0%"></div></div>
    <div id="cl-groups"></div>
    <div style="text-align:center;margin-top:8px"><button class="reset-btn" onclick="resetCL()">Reset checklist</button></div>
  </div>

  <!-- Packing -->
  <div id="view-pk" style="display:none">
    <div class="progress-header">
      <span class="prog-label">Items packed</span>
      <span class="prog-count" id="pk-count">0 / 0</span>
    </div>
    <div class="progress-bar" style="margin-bottom:16px"><div class="progress-fill" id="pk-bar" style="width:0%"></div></div>
    <div id="pk-groups"></div>
    <div style="text-align:center;margin-top:8px"><button class="reset-btn" onclick="resetPK()">Reset packing list</button></div>
  </div>
</main>

<script src="data.js"></script>
<script>
let clChecked = load('at25_cl', []);
let pkChecked = load('at25_pk', []);

function renderList(groups, checked, countId, barId, groupsId, toggleFn) {
  const total = groups.reduce((s, g) => s + g.items.length, 0);
  const done = checked.length;
  document.getElementById(countId).textContent = `${done} / ${total}`;
  document.getElementById(barId).style.width = total ? (done / total * 100) + '%' : '0%';
  document.getElementById(groupsId).innerHTML = groups.map(g => `
    <div class="cl-group">
      <div class="cl-group-title">${g.title}</div>
      ${g.items.map(item => `
        <div class="cl-item ${checked.includes(item.id) ? 'done' : ''}" onclick="${toggleFn}('${item.id}')">
          <div class="checkbox"><span class="check-mark">✓</span></div>
          <span class="cl-text">${item.text}</span>
        </div>`).join('')}
    </div>`).join('');
}

function renderCL() { renderList(CHECKLIST_GROUPS, clChecked, 'cl-count', 'cl-bar', 'cl-groups', 'toggleCL'); }
function renderPK() { renderList(PACKING_GROUPS, pkChecked, 'pk-count', 'pk-bar', 'pk-groups', 'togglePK'); }

function toggleCL(id) { const i=clChecked.indexOf(id); i>-1?clChecked.splice(i,1):clChecked.push(id); save('at25_cl',clChecked); renderCL(); }
function togglePK(id) { const i=pkChecked.indexOf(id); i>-1?pkChecked.splice(i,1):pkChecked.push(id); save('at25_pk',pkChecked); renderPK(); }
function resetCL() { if(!confirm('Reset checklist?'))return; clChecked=[]; save('at25_cl',clChecked); renderCL(); }
function resetPK() { if(!confirm('Reset packing list?'))return; pkChecked=[]; save('at25_pk',pkChecked); renderPK(); }

function switchTab(t) {
  document.getElementById('view-cl').style.display = t==='cl'?'':'none';
  document.getElementById('view-pk').style.display = t==='pk'?'':'none';
  document.getElementById('tab-cl').classList.toggle('active', t==='cl');
  document.getElementById('tab-pk').classList.toggle('active', t==='pk');
}

renderCL();
renderPK();
</script>
</body>
