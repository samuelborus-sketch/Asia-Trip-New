<main>
  <div class="sec-head">
    <div class="sec-title serif">Full Itinerary</div>
    <div class="sec-sub">25 days · May 30 – June 25 · tap any day to expand</div>
  </div>
  <div class="filter-row" id="filters"></div>
  <div id="days-list"></div>
</main>

<script src="data.js"></script>
<script>
let activeFilter = 'all';

function renderFilters() {
  const tabs = [{id:'all',label:'All Days',color:null}, ...STOPS.map(s=>({id:s.id,label:s.name,color:s.color}))];
  document.getElementById('filters').innerHTML = tabs.map(t => `
    <button class="ftab ${t.id===activeFilter?'active':''}"
      style="${t.id===activeFilter && t.color ? `background:${t.color}18;border-color:${t.color}50;color:${t.color}` : ''}"
      onclick="setFilter('${t.id}')">${t.label}</button>`).join('');
}

function renderDays() {
  const stopMap = Object.fromEntries(STOPS.map(s=>[s.id,s]));
  const visible = activeFilter === 'all' ? ITINERARY : ITINERARY.filter(d => d.stop === activeFilter);
  document.getElementById('days-list').innerHTML = visible.map(day => {
    const stop = stopMap[day.stop];
    const color = stop?.color || '#d4a853';
    const img = photoUrl(day.day);
    return `
      <div class="day-card" id="day-${day.day}">
        <div class="day-header" onclick="toggleDay(${day.day})">
          <span class="day-num">Day<br>${day.day}</span>
          <span class="day-dot" style="background:${color}"></span>
          <div class="day-info">
            <div class="day-date">${day.date} — ${day.title}</div>
            <div class="day-title" style="color:${color}bb">${stop ? stop.flag+' '+stop.name : ''}</div>
          </div>
          <svg class="day-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="day-body">
          ${img ? `<img class="day-photo" src="${img}" alt="${day.title}" loading="lazy" onerror="this.style.display='none'">` : ''}
          <div class="day-body-content">
            <ul class="act-list">${day.acts.map(a=>`<li><span>${a}</span></li>`).join('')}</ul>
            ${day.note ? `<div class="note-box"><strong>Note:</strong> ${day.note}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  // Auto-open today's day
  const now = new Date();
  if (now >= TRIP_START && now <= TRIP_END) {
    const todayIdx = Math.min(Math.max(Math.floor((now - TRIP_START) / 86400000) + 1, 1), 25);
    const el = document.getElementById('day-' + todayIdx);
    if (el) { el.classList.add('open'); el.scrollIntoView({behavior:'smooth',block:'start'}); }
  }
}

function setFilter(id) { activeFilter = id; renderFilters(); renderDays(); window.scrollTo(0,0); }
function toggleDay(n) { document.getElementById('day-'+n).classList.toggle('open'); }

renderFilters();
renderDays();
</script>
</body>
